[tools]
swiftformat = "0.62.0"
"npm:git-format-staged" = "4.0.1"

[tasks.format]
description = "Format Swift sources with SwiftFormat"
run = "swiftformat ."

[tasks.format-lint]
description = "Check SwiftFormat rules without rewriting files"
run = "swiftformat --lint --lenient --cache ignore ."

[tasks.format-lint-strict]
description = "Check SwiftFormat rules and fail on violations"
run = "swiftformat --lint --cache ignore ."
