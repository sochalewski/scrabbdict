name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    if: github.event_name != 'push'
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install project tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Validate formatting
        run: make format-lint-strict

  tests:
    name: Build and test
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}
          submodules: recursive
          lfs: true

      - name: Install project tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Prepare DAWG files
        run: |
          source=".dictionaries/DAWG/"
          destination="Scrabbdict/Resources/Dictionaries/"
          mkdir -p "$destination"
          rsync -a --delete "$source" "$destination"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Scrabbdict.xcodeproj \
            -scheme Scrabbdict \
            -onlyUsePackageVersionsFromResolvedFile \
            -derivedDataPath DerivedData

      - name: Build DAWGBuilder
        if: github.event_name != 'push'
        run: |
          xcodebuild build \
            -project Scrabbdict.xcodeproj \
            -scheme DAWGBuilder \
            -configuration Debug \
            -disableAutomaticPackageResolution \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Run enabled tests
        env:
          SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/snapshot-artifacts/failures
        run: |
          set -o pipefail
          rm -rf TestResults snapshot-artifacts
          mkdir -p TestResults snapshot-artifacts/failures

          xcodebuild test \
            -project Scrabbdict.xcodeproj \
            -scheme Scrabbdict \
            -testPlan Scrabbdict \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -resultBundlePath TestResults/Scrabbdict.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -enableCodeCoverage YES \
            -disableAutomaticPackageResolution \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Collect snapshot artifacts
        if: failure()
        run: |
          set -euo pipefail

          mkdir -p snapshot-artifacts/recorded

          while IFS= read -r snapshot; do
            destination="snapshot-artifacts/recorded/$snapshot"
            mkdir -p "$(dirname "$destination")"
            cp "$snapshot" "$destination"
          done < <(git ls-files --modified --others --exclude-standard -- ScrabbdictTests/Snapshots/__Snapshots__)

      - name: Upload snapshot failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failure-artifacts
          path: |
            snapshot-artifacts
            TestResults/Scrabbdict.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Export coverage
        run: .github/workflows/export-coverage --output coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          flags: ios
          name: Scrabbdict
          disable_search: true
          disable_telem: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  dawg_performance_changes:
    name: Detect DAWG performance changes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: macos-26
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Check changed files
        id: filter
        uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            })

            const matchingFiles = files
              .map((file) => file.filename)
              .filter((filename) => {
                const basename = filename.split('/').at(-1)
                return !filename.startsWith('ScrabbdictTests/') && /^DAWG.*\.swift$/.test(basename)
              })

            const changed = matchingFiles.length > 0
            core.setOutput('changed', String(changed))
            await core.summary
              .addHeading('DAWG performance filter')
              .addRaw(changed
                ? `Benchmark will run because these DAWG-related files changed:\n\n${matchingFiles.map((file) => `- \`${file}\``).join('\n')}`
                : 'Benchmark skipped because no DAWG-related files changed.'
              )
              .write()

  dawg_performance:
    name: DAWG performance
    needs: dawg_performance_changes
    if: needs.dawg_performance_changes.outputs.changed == 'true'
    runs-on: macos-26
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}
          submodules: recursive

      - name: Fetch target main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Resolve comparison refs
        id: refs
        run: |
          set -euo pipefail

          target_ref="origin/main"
          base_ref="$(git merge-base HEAD "$target_ref" || true)"
          if [[ -z "$base_ref" ]]; then
            base_ref="$target_ref"
          fi

          compare_ref="$(git rev-parse HEAD)"

          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "compare_ref=$compare_ref" >> "$GITHUB_OUTPUT"

      - name: Fetch dictionary LFS objects
        run: |
          set -euo pipefail

          base_dictionary_ref="$(git rev-parse "${{ steps.refs.outputs.base_ref }}:.dictionaries")"
          compare_dictionary_ref="$(git rev-parse "${{ steps.refs.outputs.compare_ref }}:.dictionaries")"

          git -C .dictionaries fetch --no-tags origin "$base_dictionary_ref"
          git -C .dictionaries fetch --no-tags origin "$compare_dictionary_ref"
          git -C .dictionaries lfs fetch --include="DAWG/*.dawg" origin "$base_dictionary_ref"
          git -C .dictionaries lfs fetch --include="DAWG/*.dawg" origin "$compare_dictionary_ref"

      - name: Run DAWG performance comparison
        run: |
          set -euo pipefail

          Scripts/dawg-performance \
            --format markdown \
            "${{ steps.refs.outputs.base_ref }}" \
            "${{ steps.refs.outputs.compare_ref }}" \
            | tee dawg-performance.md

      - name: Build pull request comment
        run: |
          set -euo pipefail

          {
            echo "<!-- dawg-performance -->"
            echo "## DAWG performance"
            echo
            echo "<details open><summary>Results</summary>"
            echo
            cat dawg-performance.md
            echo
            echo "</details>"
          } > dawg-performance-comment.md

      - name: Comment pull request
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')

            const marker = '<!-- dawg-performance -->'
            const body = fs.readFileSync('dawg-performance-comment.md', 'utf8')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })

            const existingComment = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body?.includes(marker)
            )

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }
