name: Pull Request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swiftformat:
    name: Lint
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install project tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Validate formatting
        run: make format-lint-strict

  tests:
    name: Build and test
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}
          submodules: recursive
          lfs: true

      - name: Install project tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Select default Xcode
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Scrabbdict.xcodeproj \
            -scheme Scrabbdict

      - name: Build DAWGBuilder
        run: |
          xcodebuild build \
            -project Scrabbdict.xcodeproj \
            -scheme DAWGBuilder \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Scrabbdict
        run: |
          xcodebuild build \
            -project Scrabbdict.xcodeproj \
            -scheme Scrabbdict \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Run enabled tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Scrabbdict.xcodeproj \
            -scheme Scrabbdict \
            -testPlan Scrabbdict \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
